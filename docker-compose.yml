# Local dev SQL Server only. Start with: docker compose up -d
# SA password is for this container on localhost — not for production.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: zahy-partner-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DevPassword1!Zahy"
    ports:
      - "1433:1433"
    volumes:
      - zahy-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "DevPassword1!Zahy" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  zahy-sql-data:
